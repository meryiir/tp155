CREATE TABLE TRANSACTION (
id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
montant DOUBLE PRECISION NOT NULL,
date DATE,
type VARCHAR(50),
compte_id BIGINT,
FOREIGN KEY (compte_id) REFERENCES COMPTE(id) ON DELETE CASCADE
);

