# =============== DATABASE ===============
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============== JPA / HIBERNATE ===============
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=create

# Désactiver la vérification de schéma SQL
spring.sql.init.mode=never
spring.datasource.initialization-mode=never

# =============== H2 CONSOLE ===============
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# =============== GRAPHQL ===============
spring.graphql.graphiql.enabled=true
spring.graphql.schema.locations=classpath:graphql/

# =============== SERVER ===============
server.port=8082
server.servlet.context-path=/

# =============== PACKAGE SCAN ===============
# Forcer le scan des packages
spring.jpa.properties.hibernate.search.automatic_indexing.strategy=session
spring.jpa.properties.hibernate.archive.autodetection=class, hbm

# =============== LOGGING ===============
logging.level.root=INFO
logging.level.ma.projet.graph=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE